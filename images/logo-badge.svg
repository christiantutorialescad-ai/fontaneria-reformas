<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    
    <!-- Circular Paths for Text -->
    <!-- Top arc: Clockwise from 195 to 345 deg -->
    <path id="topArc" d="M 68 250 A 182 182 0 1 1 432 250" fill="none" />
    <!-- Bottom arc: Clockwise from left to right along bottom -->
    <path id="bottomArc" d="M 432 250 A 182 182 0 0 1 68 250" fill="none" />
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="250" cy="250" r="236" fill="url(#blueGrad)" stroke="#f59e0b" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Outer Dotted Ring -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="250" cy="250" r="148" fill="#172554" stroke="#f59e0b" stroke-width="4"/>

  <!-- Text Top Arc: FONTANERÍA -->
  <text fill="#ffffff" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" letter-spacing="7" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">FONTANERÍA</textPath>
  </text>

  <!-- Text Bottom Arc: CONSTRUCCIÓN -->
  <text fill="#ffffff" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" letter-spacing="7" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">CONSTRUCCIÓN</textPath>
  </text>

  <!-- Stars on left and right -->
  <polygon points="58,250 63,238 75,238 65,230 69,218 58,225 47,218 51,230 41,238 53,238" fill="#f59e0b" />
  <polygon points="442,250 447,238 459,238 449,230 453,218 442,225 431,218 435,230 425,238 437,238" fill="#f59e0b" />

  <!-- Center Graphic Elements -->
  <!-- House Roof & Chimney -->
  <g transform="translate(180, 155)">
    <!-- Chimney -->
    <rect x="95" y="15" width="16" height="30" fill="#ffffff" rx="2" />
    <!-- Roof Gable -->
    <path d="M 70 8 L 135 60 L 122 70 L 70 28 L 18 70 L 5 60 Z" fill="#ffffff" />
  </g>

  <!-- Central F&R text -->
  <text x="250" y="240" fill="#ffffff" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="2">
    F&amp;R
  </text>

  <!-- Wrench and Trowel / Brick Wall Graphic -->
  <g transform="translate(185, 248)">
    <!-- Brick Wall -->
    <g fill="#ffffff">
      <!-- Row 1 -->
      <rect x="68" y="18" width="28" height="10" rx="1"/>
      <rect x="98" y="18" width="28" height="10" rx="1"/>
      <!-- Row 2 -->
      <rect x="54" y="30" width="26" height="10" rx="1"/>
      <rect x="82" y="30" width="28" height="10" rx="1"/>
      <rect x="112" y="30" width="18" height="10" rx="1"/>
    </g>
    <!-- Trowel handle -->
    <path d="M 50 36 L 40 46" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <polygon points="40,46 54,42 48,34" fill="#f59e0b" />

    <!-- Wrench Tool on Left -->
    <g transform="rotate(-35, 25, 25)">
      <path d="M 10 5 C 6 8 6 14 10 17 L 38 45 C 41 48 46 48 49 45 L 53 41 C 56 38 56 33 53 30 L 25 2 C 22 -1 16 -1 13 2 L 18 7 L 15 10 L 10 5 Z" fill="#ffffff"/>
      <circle cx="46" cy="42" r="3" fill="#172554"/>
    </g>
  </g>

  <!-- Subtitle Ribbon: REFORMAS Y ALBAÑILERÍA -->
  <rect x="120" y="308" width="260" height="26" rx="13" fill="#f59e0b" />
  <text x="250" y="325" fill="#0f172a" font-family="'Montserrat', 'Arial', sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle">
    REFORMAS Y ALBAÑILERÍA
  </text>

  <!-- 20 Años de Experiencia mini banner -->
  <text x="250" y="352" fill="#93c5fd" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">
    20 AÑOS DE EXPERIENCIA
  </text>
</svg>
